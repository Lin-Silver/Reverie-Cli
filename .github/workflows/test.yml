name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local documentation
        run: python scripts/verification/check_docs.py

  desktop:
    name: Desktop tests, types, and renderer build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReverieCli-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ReverieCli-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check package validation helpers
        run: node --test scripts/package-validation.node-test.mjs
      - name: Check frozen retrieval evaluation contract
        run: node --test ../scripts/verification/context-evaluation.node-test.mjs ../scripts/verification/context-ndcg.node-test.mjs ../scripts/verification/audit-python-baselines.node-test.mjs
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo fmt --manifest-path ReverieCli-rs/Cargo.toml --all -- --check
      - name: Test Rust workspace
        run: cargo test --manifest-path ReverieCli-rs/Cargo.toml --workspace --locked
      - name: Check Rust lints
        run: cargo clippy --manifest-path ReverieCli-rs/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Build native Rust program
        run: cargo build --manifest-path ReverieCli-rs/Cargo.toml --release --locked
      - name: Run actual native entry and SDK checks
        run: node scripts/verification/rust-smoke.mjs
      - name: Run actual configuration and session checks
        run: node scripts/verification/rust-session-smoke.mjs
      - name: Run actual Context Engine checks
        run: node scripts/verification/rust-context-smoke.mjs
      - name: Run actual model protocol, tools, approvals and cancellation checks
        run: node scripts/verification/rust-run-smoke.mjs
