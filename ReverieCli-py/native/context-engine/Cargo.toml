[package]
name = "reverie-context-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
ignore = "=0.4.25"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tree-sitter = "=0.26.13"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"
walkdir = "=2.5.0"

[profile.release]
lto = "thin"
strip = true
