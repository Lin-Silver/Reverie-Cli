name: Build plugin release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-plugins.yml"
      - "plugins/**"
      - "ReverieCli-py/reverie/plugin/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BLENDER_ARCHIVE_NAME: blender-5.1.1-windows-x64.zip
      BLENDER_ARCHIVE_URL: https://download.blender.org/release/Blender5.1/blender-5.1.1-windows-x64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare isolated plugin builder
        shell: pwsh
        run: |
          python -m venv ReverieCli-py\venv
          ReverieCli-py\venv\Scripts\python.exe -m pip install "pip==26.1.2" "pyinstaller==6.19.0"
          $archive = Join-Path $env:GITHUB_WORKSPACE "plugins\blender\$env:BLENDER_ARCHIVE_NAME"
          Invoke-WebRequest -Uri $env:BLENDER_ARCHIVE_URL -OutFile $archive
          $expected = "307123caa3bad0c1d04ec373a2f22f622c403eecb34b9c646ede104906b04ced"
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) {
            throw "Blender portable archive SHA-256 mismatch"
          }

      - name: Build and handshake official plugins
        shell: pwsh
        run: |
          $plugins = @(
            @{ Id = "blender"; Dir = "plugins\blender"; Asset = "reverie-blender.exe" },
            @{ Id = "game_models"; Dir = "plugins\game_models"; Asset = "reverie-game-models.exe" },
            @{ Id = "renpy"; Dir = "plugins\renpy"; Asset = "reverie-renpy.exe" },
            @{ Id = "live2d"; Dir = "plugins\live2d"; Asset = "reverie-live2d.exe" }
          )
          foreach ($plugin in $plugins) {
            & "$($plugin.Dir)\build.bat"
            if ($LASTEXITCODE -ne 0) { throw "Plugin build failed: $($plugin.Id)" }
            $exe = Join-Path $plugin.Dir "dist\$($plugin.Asset)"
            $handshake = & $exe -RC | ConvertFrom-Json
            if ($handshake.plugin_id -ne $plugin.Id) { throw "Plugin handshake mismatch: $($plugin.Id)" }
          }

      - name: Generate dedicated plugin manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $entries = @()
          foreach ($plugin in @(
            @{ Id = "blender"; Dir = "blender"; Asset = "reverie-blender.exe" },
            @{ Id = "game_models"; Dir = "game_models"; Asset = "reverie-game-models.exe" },
            @{ Id = "renpy"; Dir = "renpy"; Asset = "reverie-renpy.exe" },
            @{ Id = "live2d"; Dir = "live2d"; Asset = "reverie-live2d.exe" }
          )) {
            $source = "plugins\$($plugin.Dir)\dist\$($plugin.Asset)"
            Copy-Item $source release-assets
            $definition = Get-Content "plugins\$($plugin.Dir)\plugin.json" -Raw | ConvertFrom-Json
            $entries += [ordered]@{
              id = $plugin.Id
              name = $definition.display_name
              version = $definition.version
              asset_name = $plugin.Asset
              download_url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/plugins-latest/$($plugin.Asset)"
              sha256 = (Get-FileHash -Algorithm SHA256 $source).Hash.ToLowerInvariant()
              size = (Get-Item $source).Length
              capabilities = @($definition.capabilities)
            }
          }
          [ordered]@{
            schema = "reverie.plugins.release.v2"
            commit = $env:GITHUB_SHA
            platform = "windows-x64"
            plugins = $entries
          } | ConvertTo-Json -Depth 20 | Set-Content release-assets\plugins-manifest.json -Encoding utf8
          $manifest = Get-Content release-assets\plugins-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.plugins.Count -ne 4) { throw "Expected four official compiled plugins" }

      - uses: actions/upload-artifact@v4
        with:
          name: reverie-plugins-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: release-assets/*

      - name: Publish dedicated plugin release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f plugins-latest $env:GITHUB_SHA
          git push origin refs/tags/plugins-latest --force
          $notes = @'
          This release contains all four official Windows x64 plugins: Blender, Game Models, Ren'Py, and Live2D.

          Blender now bundles RuiC Card Skill. When the Blender plugin is enabled and trusted, Reverie automatically discovers the Skill and its persistent scripts and references. The 2D portrait-avatar workflow preserves the original illustration, creates an editable Blender mesh and face masks, and delivers a browser/OBS character with blinking, mouth movement, smile, gaze, breathing, and hair motion. A local pose relay lets the normal browser controls and microphone lips drive OBS; only numeric character parameters are sent, and audio stays in the browser. Transparent PNG export and a software renderer are included.

          Blender 5.1.1 keeps the existing portable plugin depot. Blender Python failures are reported as failed plugin calls. Rigged character GLB exports retain skinning, facial morphs, and animations. The separate 3D authoring route is a scaffold that requires reference-specific modeling and visual validation. Game Models, Ren'Py, and Live2D have also been rebuilt with the current protocol and packaging fixes.

          Use the Reverie core from this revision for persistent plugin Skill resource lookup and the corrected character export. The accompanying manifest records all four versions, capabilities, SHA-256 digests, sizes, and stable download URLs. Upstream application runtimes are unchanged.
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP "plugin-release-notes.md"
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          gh release view plugins-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit plugins-latest --title "Reverie Plugins Latest" --notes-file $notesPath
          } else {
            gh release create plugins-latest --title "Reverie Plugins Latest" --notes-file $notesPath --latest=false
          }
          $assets = Get-ChildItem -LiteralPath release-assets -File | Sort-Object { $_.Name -eq 'plugins-manifest.json' }, Name
          foreach ($asset in $assets) {
            gh release upload plugins-latest $asset.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Plugin asset upload failed: $($asset.Name)" }
          }
