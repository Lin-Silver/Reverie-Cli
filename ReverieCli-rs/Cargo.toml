[workspace]
members = ["crates/protocol", "crates/core", "crates/context", "crates/cli"]
resolver = "3"

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Lin-Silver/Reverie-Cli"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.43.0", features = ["bundled", "backup"] }
uuid = { version = "=1.29.3", features = ["v4", "v5"] }
sha2 = "=0.11.1"
sha1 = "=0.11.0"
chrono = "=0.4.45"
tempfile = "=3.27.0"
reverie-protocol = { path = "crates/protocol" }
reverie-core = { path = "crates/core" }
reverie-context = { path = "crates/context" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
