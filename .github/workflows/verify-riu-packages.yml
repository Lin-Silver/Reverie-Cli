name: Verify RIU native validation packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riu-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            runner: windows-latest
            platform: windows
            arch: x64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            arch: x64
          - label: macOS Apple Silicon
            runner: macos-latest
            platform: macos
            arch: arm64
          - label: macOS Intel
            runner: macos-15-intel
            platform: macos
            arch: x64
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # actions/setup-python's post step fails the job when pip's cache directory
      # is missing, which on Windows happened after every artifact had already
      # been built and uploaded. A failed build leaves `publish` skipped, so the
      # rolling `latest` release keeps serving stale binaries. Pin the location
      # so it is created once, in the workspace, on every runner.
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the pip cache directory
        shell: bash
        run: mkdir -p "$PIP_CACHE_DIR"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ReverieCli-py/requirements.txt
            ReverieCli-py/setup.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ReverieCli-ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Windows FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ffmpeg --version=8.1.2 --yes --no-progress

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libfuse2

      - name: Install macOS FFmpeg
        if: runner.os == 'macOS'
        run: command -v ffmpeg >/dev/null || brew install ffmpeg

      - name: Build and verify Windows kernel
        if: runner.os == 'Windows'
        shell: cmd
        env:
          REVERIE_PYINSTALLER_MODE: onefile
        run: ReverieCli-py\build.bat --clean --test-exe --skip-plugins --no-pause

      - name: Verify standalone Windows EXE without adjacent runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $standalone = Join-Path $env:RUNNER_TEMP 'reverie-standalone'
          New-Item -ItemType Directory -Path $standalone -Force | Out-Null
          Copy-Item -LiteralPath dist\reverie.exe -Destination $standalone
          $executable = Join-Path $standalone 'reverie.exe'
          & $executable --kernel-info
          if ($LASTEXITCODE -ne 0) { throw 'Standalone kernel handshake failed' }
          python ReverieCli-py/scripts/smoke_sdk_bridge.py --executable $executable --timeout 120
          if ($LASTEXITCODE -ne 0) { throw 'Standalone SDK bridge failed' }

      - name: Build and verify Unix kernel
        if: runner.os != 'Windows'
        run: |
          chmod +x ReverieCli-py/build.sh
          ReverieCli-py/build.sh --clean --test-exe

      - name: Smoke-test compiled SDK bridge
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            python ReverieCli-py/scripts/smoke_sdk_bridge.py --executable dist/reverie.exe
          else
            python ReverieCli-py/scripts/smoke_sdk_bridge.py --executable dist/reverie
          fi

      - name: Install desktop dependencies
        working-directory: ReverieCli-ui
        run: npm ci

      - name: Verify validation-package filesystem permissions
        working-directory: ReverieCli-ui
        run: node --test scripts/package-validation.node-test.mjs

      - name: Make package hooks executable
        if: runner.os != 'Windows'
        run: chmod +x ReverieCli-ui/build/launchers/reverieui ReverieCli-ui/build/linux/*.sh

      - name: Build Windows desktop artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:REVERIE_EXTERNAL_KERNEL_PATH = Join-Path $env:GITHUB_WORKSPACE "dist\reverie.exe"
          $env:REVERIE_PYINSTALLER_PATH = (Join-Path $env:GITHUB_WORKSPACE "ReverieCli-py\venv\Scripts\pyinstaller.exe")
          $env:REVERIE_PYTHON_PATH = (Join-Path $env:GITHUB_WORKSPACE "ReverieCli-py\venv\Scripts\python.exe")
          Push-Location ReverieCli-ui
          npm run build:kernel
          if ($LASTEXITCODE -ne 0) { throw "Validation kernel staging failed" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Validation desktop compilation failed" }
          node scripts/package-validation.mjs --output release/validation --arch x64
          if ($LASTEXITCODE -ne 0) { throw "Validation installer build failed" }
          Pop-Location

      - name: Build Linux desktop artifacts
        if: runner.os == 'Linux'
        run: |
          export REVERIE_EXTERNAL_KERNEL_PATH="$GITHUB_WORKSPACE/dist/reverie"
          export REVERIE_PYINSTALLER_PATH="$GITHUB_WORKSPACE/ReverieCli-py/venv/bin/pyinstaller"
          export REVERIE_PYTHON_PATH="$GITHUB_WORKSPACE/ReverieCli-py/venv/bin/python"
          cd ReverieCli-ui
          npm run build:kernel
          npm run build
          node scripts/package-validation.mjs --output release/validation --arch x64

      - name: Build macOS desktop artifact
        if: runner.os == 'macOS'
        run: |
          export REVERIE_EXTERNAL_KERNEL_PATH="$GITHUB_WORKSPACE/dist/reverie"
          export REVERIE_PYINSTALLER_PATH="$GITHUB_WORKSPACE/ReverieCli-py/venv/bin/pyinstaller"
          export REVERIE_PYTHON_PATH="$GITHUB_WORKSPACE/ReverieCli-py/venv/bin/python"
          cd ReverieCli-ui
          npm run build:kernel
          npm run build
          node scripts/package-validation.mjs --output release/validation --arch ${{ matrix.arch }}

      - name: Stage Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./ReverieCli-ui/package.json').version"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\reverie.exe release-assets\reverie.exe
          Copy-Item "ReverieCli-ui\release\validation\Reverie-Setup-$version-x64.exe" release-assets
          python ReverieCli-py\scripts\write_kernel_manifest.py --executable dist\reverie.exe --output release-assets\reverie-kernel-windows-x64.json --asset-name reverie.exe

      - name: Stage Unix release assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./ReverieCli-ui/package.json').version")
          mkdir -p release-assets
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            cp dist/reverie release-assets/reverie
            cp "ReverieCli-ui/release/validation/Reverie-$version-linux-x64.AppImage" release-assets/
            cp "ReverieCli-ui/release/validation/Reverie-$version-linux-x64.deb" release-assets/
            python ReverieCli-py/scripts/write_kernel_manifest.py --executable dist/reverie --output release-assets/reverie-kernel-linux-x64.json --asset-name reverie
          else
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              mac_variant="Apple-Silicon"
            else
              mac_variant="Intel"
            fi
            core_asset="Reverie-CLI-macOS-$mac_variant"
            dmg_asset="Reverie-$version-macOS-$mac_variant.dmg"
            cp dist/reverie "release-assets/$core_asset"
            cp "ReverieCli-ui/release/validation/Reverie-$version-mac-${{ matrix.arch }}.dmg" "release-assets/$dmg_asset"
            python ReverieCli-py/scripts/write_kernel_manifest.py --executable dist/reverie --output "release-assets/reverie-kernel-macos-${{ matrix.arch }}.json" --asset-name "$core_asset"
          fi

      - name: Verify staged names and contents
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assets = list(Path("release-assets").iterdir())
          if not assets or any(not item.is_file() or item.stat().st_size == 0 for item in assets):
              raise SystemExit("Release staging contains a missing or empty artifact")
          for manifest in Path("release-assets").glob("*.json"):
              payload = json.loads(manifest.read_text(encoding="utf-8"))
              if payload.get("schema") != "reverie.kernel.release.v1" or len(payload.get("sha256", "")) != 64:
                  raise SystemExit(f"Invalid kernel manifest: {manifest}")
          print("Verified:", ", ".join(sorted(item.name for item in assets)))
          PY

      - name: Install pinned interoperability fixture
        shell: bash
        run: |
          mkdir -p .runtime/riu-sdk
          cp scripts/verification/fixtures/mcp-apps/package*.json .runtime/riu-sdk/
          npm ci --prefix .runtime/riu-sdk

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libasound2t64 fonts-noto-cjk

      - name: Install Windows validation package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./ReverieCli-ui/package.json').version"
          $installRoot = Join-Path $env:GITHUB_WORKSPACE '.runtime\riu-installed'
          if (Test-Path -LiteralPath $installRoot) { throw 'Installation target already exists' }
          $installer = Join-Path $env:GITHUB_WORKSPACE "ReverieCli-ui\release\validation\Reverie-Setup-$version-x64.exe"
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $installed = Join-Path $installRoot 'ReverieUI.exe'
          $original = 'ReverieCli-ui\release\validation\win-unpacked\ReverieUI.exe'
          if ((Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $original).Hash) { throw 'Installed Desktop differs from packaged payload' }
          & (Join-Path $installRoot 'reverie.exe') --kernel-info
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI handshake failed' }
          "RIU_INSTALLED_PACKAGE=$installRoot" >> $env:GITHUB_ENV

      - name: Install Linux validation package
        if: runner.os == 'Linux'
        run: |
          version=$(node -p "require('./ReverieCli-ui/package.json').version")
          sudo apt-get install --yes "./ReverieCli-ui/release/validation/Reverie-$version-linux-x64.deb"
          test "$(readlink /usr/bin/reverie)" = /opt/Reverie/reverie
          test "$(readlink /usr/bin/reverieui)" = /opt/Reverie/reverieui
          reverie --kernel-info
          cmp /opt/Reverie/ReverieUI ReverieCli-ui/release/validation/linux-unpacked/ReverieUI
          echo 'RIU_INSTALLED_PACKAGE=/opt/Reverie' >> "$GITHUB_ENV"

      - name: Install macOS validation package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./ReverieCli-ui/package.json').version")
          mount="$GITHUB_WORKSPACE/.runtime/riu-dmg-mount"
          install="$GITHUB_WORKSPACE/.runtime/riu-installed"
          mkdir -p "$mount" "$install"
          hdiutil attach "ReverieCli-ui/release/validation/Reverie-$version-mac-${{ matrix.arch }}.dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          bundles=("$mount"/*.app)
          test "${#bundles[@]}" -eq 1
          ditto "${bundles[0]}" "$install/$(basename "${bundles[0]}")"
          echo "RIU_INSTALLED_PACKAGE=$install" >> "$GITHUB_ENV"

      - name: Verify native installed payload
        shell: bash
        env:
          RIU_RUNNER_OS: ${{ runner.os }}
          RIU_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [[ "$RIU_RUNNER_OS" == "Windows" ]]; then
            test_python="ReverieCli-py/venv/Scripts/python.exe"
          else
            test_python="ReverieCli-py/venv/bin/python"
          fi
          command=("$test_python" scripts/verification/riu_package_native.py --package "$RIU_INSTALLED_PACKAGE" --sdk-root .runtime/riu-sdk --output .runtime/riu-package-native)
          if [[ "$RIU_RUNNER_OS" == "Linux" ]]; then
            test "$(stat -c '%u:%g:%a' "$RIU_INSTALLED_PACKAGE/chrome-sandbox")" = '0:0:4755'
            xvfb-run -a "${command[@]}"
          else
            "${command[@]}"
          fi

      - name: Verify Linux installed launcher and AppImage
        if: runner.os == 'Linux'
        run: |
          version=$(node -p "require('./ReverieCli-ui/package.json').version")
          image=$(realpath "ReverieCli-ui/release/validation/Reverie-$version-linux-x64.AppImage")
          mkdir .runtime/riu-appimage-payload
          cd .runtime/riu-appimage-payload
          "$image" --appimage-extract > extraction.log
          sudo chown root:root squashfs-root/chrome-sandbox
          sudo chmod 4755 squashfs-root/chrome-sandbox
          for target in installed-launcher appimage; do
            if [[ "$target" == "installed-launcher" ]]; then executable=/usr/bin/reverieui; else executable="$PWD/squashfs-root/AppRun"; fi
            xvfb-run -a env PORTABLE_EXECUTABLE_DIR="$GITHUB_WORKSPACE/.runtime/$target-home" REVERIE_APP_ROOT="$GITHUB_WORKSPACE/.runtime/$target-core" timeout 180 "$executable" --riu-isolation-probe --riu-probe-report "$GITHUB_WORKSPACE/.runtime/riu-package-native/$target-isolation.json"
          done
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ['installed-launcher', 'appimage']:
              report = json.loads(Path(f'.runtime/riu-package-native/{name}-isolation.json').read_text())
              assert report['checks'] and all(c['passed'] for c in report['checks']), name
          PY

      - name: Verify Windows uninstallation
        if: always() && runner.os == 'Windows' && env.RIU_INSTALLED_PACKAGE != ''
        shell: pwsh
        run: |
          $uninstallers = @(Get-ChildItem -LiteralPath $env:RIU_INSTALLED_PACKAGE -Filter 'Uninstall*.exe')
          if ($uninstallers.Count -ne 1) { throw 'Expected one native uninstaller' }
          $process = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList @('/S', "_?=$env:RIU_INSTALLED_PACKAGE") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
          if (Test-Path -LiteralPath (Join-Path $env:RIU_INSTALLED_PACKAGE 'ReverieUI.exe')) { throw 'Desktop survived uninstallation' }
          Write-Output 'Verified native installation, installed runtime, and uninstallation'

      - name: Verify Linux uninstallation
        if: always() && runner.os == 'Linux' && env.RIU_INSTALLED_PACKAGE != ''
        run: |
          sudo apt-get remove --yes reverie
          test ! -e /opt/Reverie/ReverieUI
          test ! -L /usr/bin/reverie
          test ! -L /usr/bin/reverieui

      - name: Verify macOS uninstallation
        if: always() && runner.os == 'macOS' && env.RIU_INSTALLED_PACKAGE != ''
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          owned = Path(os.environ['GITHUB_WORKSPACE']).resolve()/'.runtime/riu-installed'
          package = Path(os.environ['RIU_INSTALLED_PACKAGE']).resolve()
          assert package == owned
          bundles = list(package.glob('*.app'))
          assert len(bundles) == 1 and bundles[0].resolve().parent == owned
          shutil.rmtree(bundles[0])
          assert not bundles[0].exists()
          print('Verified DMG installation, installed runtime, and application removal')
          PY

      - name: Retain native checks including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riu-native-evidence-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: warn
          path: .runtime/riu-package-native/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riu-validation-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: release-assets/*
