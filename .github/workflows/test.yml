name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check local documentation
        run: node scripts/verification/check-docs.mjs
      - name: Test documentation validation
        run: node --test scripts/verification/check-docs.node-test.mjs

  desktop:
    name: Desktop tests, types, and renderer build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReverieCli-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ReverieCli-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check package validation helpers
        run: node --test scripts/package-validation.node-test.mjs
      - name: Check frozen retrieval evaluation contract
        run: node --test ../scripts/verification/context-evaluation.node-test.mjs ../scripts/verification/context-ndcg.node-test.mjs ../scripts/verification/audit-python-baselines.node-test.mjs
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo fmt --manifest-path ReverieCli-rs/Cargo.toml --all -- --check
      - name: Test Rust workspace
        run: cargo test --manifest-path ReverieCli-rs/Cargo.toml --workspace --locked
      - name: Check Rust lints
        run: cargo clippy --manifest-path ReverieCli-rs/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Build native Rust program
        run: cargo build --manifest-path ReverieCli-rs/Cargo.toml --release --locked
      - name: Check generated desktop protocol types
        run: node ReverieCli-ui/scripts/generate-core-types.mjs --check
      - name: Run actual native entry and SDK checks
        run: node scripts/verification/rust-smoke.mjs
      - name: Run actual configuration and session checks
        run: node scripts/verification/rust-session-smoke.mjs
      - name: Install the Motion acceptance browser
        if: runner.os != 'Linux'
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Windows/X64) platform=win64; executable=chrome.exe ;;
            macOS/ARM64) platform=mac-arm64; executable='Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' ;;
            macOS/X64) platform=mac-x64; executable='Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' ;;
            *) exit 1 ;;
          esac
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 "https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.4/$platform/chrome-$platform.zip" -o motion-chrome.zip
          unzip -q motion-chrome.zip
          browser="$PWD/chrome-$platform/$executable"
          test -f "$browser"
          if [ "$RUNNER_OS" = Windows ]; then browser="$(cygpath -w "$browser")"; fi
          echo "REVERIE_MOTION_BROWSER=$browser" >> "$GITHUB_ENV"
      - name: Select Ubuntu's installed Chrome with its system sandbox
        if: runner.os == 'Linux'
        run: echo "REVERIE_MOTION_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Run standalone native skills and conversation policy checks
        run: node scripts/verification/rust-skills-smoke.mjs
      - name: Run native market source, cache, Git and cancellation checks
        run: node scripts/verification/rust-markets-smoke.mjs
      - name: Run actual Context Engine checks
        run: node scripts/verification/rust-context-smoke.mjs
      - name: Run actual native parser checks
        run: node scripts/verification/rust-parser-smoke.mjs
      - name: Run actual offline resource validation checks
        run: node scripts/verification/rust-resources-smoke.mjs
      - name: Run actual model protocol, tools, approvals and cancellation checks
        run: node scripts/verification/rust-run-smoke.mjs
      - name: Run actual provider protocol and signed-state checks
        run: node scripts/verification/rust-provider-smoke.mjs
      - name: Run actual workspace commands and process-tree cleanup checks
        run: node scripts/verification/rust-command-smoke.mjs
      - name: Install native terminal check dependencies
        run: npm ci --prefix ReverieCli-ui --ignore-scripts
      - name: Build the native terminal verification dependency
        if: runner.os != 'Windows'
        env:
          npm_config_build_from_source: "true"
        run: npm rebuild node-pty --prefix ReverieCli-ui
      - name: Build Electron bridge
        run: npm run build:main --prefix ReverieCli-ui
      - name: Run actual desktop bridge and task recovery checks
        run: node scripts/verification/rust-desktop-bridge-smoke.mjs
      - name: Run actual scrolling terminal and single-prompt checks
        run: node scripts/verification/rust-tui-smoke.mjs
      - name: Preserve failed native verification evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-failure-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            .runtime/rust-3.0/
            !.runtime/rust-3.0/skills-smoke/**/test-user/**
            !.runtime/rust-3.0/skills-smoke/**/browser-profile/**
            !.runtime/rust-3.0/skills-smoke/**/native/**
          include-hidden-files: true
          if-no-files-found: ignore
