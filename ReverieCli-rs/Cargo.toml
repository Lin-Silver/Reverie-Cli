[workspace]
members = ["crates/protocol", "crates/core", "crates/context", "crates/platform", "crates/cli"]
resolver = "3"

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Lin-Silver/Reverie-Cli"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = { version = "=11.1.0", features = ["serde-json-impl"] }
rusqlite = { version = "=0.43.0", features = ["bundled", "backup"] }
uuid = { version = "=1.29.3", features = ["v4", "v5"] }
sha2 = "=0.11.1"
sha1 = "=0.11.0"
chrono = "=0.4.45"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "system-proxy"] }
shlex = "=2.0.1"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "=0.29.0"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
reverie-platform = { path = "crates/platform" }
reverie-protocol = { path = "crates/protocol" }
reverie-core = { path = "crates/core" }
reverie-context = { path = "crates/context" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
