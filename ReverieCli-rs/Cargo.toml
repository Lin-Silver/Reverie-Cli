[workspace]
members = ["crates/protocol", "crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Lin-Silver/Reverie-Cli"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reverie-protocol = { path = "crates/protocol" }
reverie-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
