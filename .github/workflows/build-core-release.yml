name: Build Rust release candidates

on:
  workflow_dispatch:
  push:
    tags: ["v3.*"]

# Candidate builds cannot create releases or change any Git ref.
permissions:
  contents: read

concurrency:
  group: rust-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v3.')
    name: ${{ matrix.platform }} ${{ matrix.arch }} native candidate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            binary: reverie.exe
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            binary: reverie
          - runner: macos-latest
            platform: macos
            arch: arm64
            binary: reverie
          - runner: macos-15-intel
            platform: macos
            arch: x64
            binary: reverie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal
      - name: Build locked native program
        run: cargo build --manifest-path ReverieCli-rs/Cargo.toml --release --locked
      - name: Verify actual native program and record its identity
        run: node scripts/verification/rust-smoke.mjs ReverieCli-rs/target/release/${{ matrix.binary }} .runtime/rust-candidate/native-smoke.json
      - name: Upload candidate and actual verification record
        uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ReverieCli-rs/target/release/${{ matrix.binary }}
            ReverieCli-rs/target/release/builtin_skills/
            .runtime/rust-candidate/native-smoke.json
          if-no-files-found: error
